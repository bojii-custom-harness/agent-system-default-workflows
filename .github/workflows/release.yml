name: Publish Releases

on:
  push:
    tags:
      - 'workflow-*-*'
      - 'system-skills-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional approved tag to verify before catch-up publication
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: default-workflows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node ./scripts/publish-releases.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
