name: Publish Default Workflows CLI

on:
  push:
    tags:
      - 'cli/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact CLI tag to publish or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: default-workflows-cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm test
      - name: Package the fixed CLI
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG -ne "cli/v$version") { throw "Release tag does not match package version." }
          New-Item -ItemType Directory -Path dist | Out-Null
          npm pack --pack-destination dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assetName = "agent-system-default-workflows-cli-$version.tgz"
          Move-Item "dist/bojii-custom-harness-agent-system-default-workflows-$version.tgz" "dist/$assetName"
          $sha256 = (Get-FileHash "dist/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$sha256  $assetName`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "dist/SHA256SUMS"),
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Publish the immutable CLI Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $env:RELEASE_TAG `
            "dist/agent-system-default-workflows-cli-$version.tgz" `
            dist/SHA256SUMS `
            --title "Agent System Default Workflows CLI v$version" `
            --notes "Fixed, self-contained Default Workflows catalog and exact-release download CLI."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
